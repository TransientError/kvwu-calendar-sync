[project]
name = "kvwu-calendar-sync"
version = "0.1.0"
description = "Sync Microsoft 365 Outlook calendar events to Google Calendar with filtering and color-coding"
requires-python = ">=3.11"
dependencies = [
    "msal>=1.24.0",
    "google-auth>=2.22.0",
    "google-auth-oauthlib>=1.0.0",
    "google-api-python-client>=2.95.0",
    "httpx>=0.25.0",
    "tenacity>=8.2.0",
    "filelock>=3.12.0",
]

[tool.uv]
package = false
