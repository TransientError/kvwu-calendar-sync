[microsoft]
client_id = "YOUR_AZURE_APP_CLIENT_ID"
tenant_id = "YOUR_AZURE_TENANT_ID"

[google]
credentials_file = "credentials.json"

[sync]
# How many days ahead to sync
lookahead_days = 180

# Which response statuses to sync: "accepted", "tentativelyAccepted", "notResponded"
# "declined" is excluded by default
include_statuses = ["accepted"]

# Subjects that always sync regardless of response status (case-insensitive substring match).
# Useful for on-call schedules you haven't accepted yet but need visibility on.
always_sync_subjects = ["on-call"]

# Skip events you created for yourself with no other attendees (time blocks, commute, lunch).
skip_solo_events = true

# Which showAs values to include (empty = all): "busy", "tentative", "free", "oof", "workingElsewhere"
# include_show_as = ["busy", "oof", "workingElsewhere"]

# How often the sync runs (informational, actual schedule is via cron)
poll_interval_minutes = 5

# Google Calendar ID to sync into.
# Create a dedicated calendar (e.g., "Work") and paste its ID here.
# Find it in Google Calendar → Settings → <calendar> → "Integrate calendar" → Calendar ID.
# DO NOT use "primary" unless you want work events mixed into your personal calendar.
google_calendar_id = ""

[retry]
# Max retries for API calls (uses exponential backoff)
max_attempts = 3
# Initial wait between retries in seconds
initial_wait = 2

[colors]
# Default color for synced events
default = "sage"

# Available colors (lowercase only):
# lavender, sage, grape, flamingo, banana,
# tangerine, peacock, graphite, blueberry, basil, tomato

# Color overrides based on event properties
[[colors.rules]]
field = "subject"
contains = "standup"
color = "graphite"

[[colors.rules]]
field = "subject"
contains = "1:1"
color = "peacock"

[[colors.rules]]
field = "isAllDay"
equals = true
color = "banana"
